# GitHub Pages에 Vite 프로젝트를 배포하기 위한 설정
name: Deploy Vite Project to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # ★★★ 수정된 부분: ShareEdu 폴더 안의 package-lock.json을 사용
          cache-dependency-path: ShareEdu/package-lock.json 
      
      - name: Install dependencies
        # ★★★ 수정된 부분: ShareEdu 폴더로 이동해서 npm install 실행
        run: cd ShareEdu && npm install
        
      - name: Build
        # ★★★ 수정된 부분: ShareEdu/client 폴더로 이동해서 npm run build 실행
        run: cd ShareEdu/client && npm run build -- --base=/clocks3789-coder-3/
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ★★★ 수정된 부분: 빌드 결과물은 ShareEdu/client/dist 폴더에 생성됨
          path: './ShareEdu/client/dist'

  # 배포 작업 (이 부분은 수정 필요 없음)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
